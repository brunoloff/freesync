[workspace]
members = ["crates/core", "crates/google", "crates/cli", "desktop/src-tauri"]
default-members = ["crates/core", "crates/google", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
globset = "0.4"
md-5 = "0.10"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
